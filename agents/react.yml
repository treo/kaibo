# Reasoning-heavy variant of the chat agent: explicit ReAct cycles.
id: react
description: ReAct orchestrator over an OpenAI-compatible model
modules:
  - module: kaibo.primitives.SimpleConversation
    id: history
  - module: kaibo.primitives.OpenAILLM
    id: llm
    config:
      model: gpt-4.1-nano
  - module: kaibo.primitives.FunctionToolProvider
    id: tools
    config:
      tool_classes:
        - kaibo.examples.DemoTools
  - module: kaibo.primitives.ReActOrchestrator
    id: orchestrator
    config:
      max_iterations: 8
      show_reasoning: false
